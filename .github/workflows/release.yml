name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. v0.1. Publish a Release only when it matches an existing tag.'
        required: true
        default: 'v0.1'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      published: ${{ steps.version.outputs.published }}
      notes: ${{ steps.version.outputs.notes }}
    steps:
      - name: Check out the revision being built
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}

      - name: Resolve version and release notes
        id: version
        env:
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [ -n "${DISPATCH_VERSION:-}" ]; then
            VERSION="$DISPATCH_VERSION"
          else
            VERSION="${REF_NAME#release/}"
          fi
          NOTES="docs/release/${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "::warning::No release notes at $NOTES, falling back to generated notes."
            NOTES=""
          fi
          if [ "${REF_TYPE:-}" = "tag" ]; then
            PUBLISHED="true"
          elif [ -n "${DISPATCH_VERSION:-}" ] && git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            PUBLISHED="true"
          else
            PUBLISHED="false"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "published=$PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "Building $VERSION (publish=$PUBLISHED, notes=${NOTES:-generated})"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::error::Secret KEYSTORE_BASE64 is not set. A release APK must be signed."
            exit 1
          fi
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/release.jks

      - name: Write keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          cat > keystore.properties <<EOF
          storeFile=keystore/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build the release APK
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          ls -lh "$APK"
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS/apksigner" verify --print-certs "$APK"

      - name: Upload the APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: moshi-${{ steps.version.outputs.version }}-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: steps.version.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          NOTES: ${{ steps.version.outputs.notes }}
        run: |
          set -euo pipefail
          if [ -n "$NOTES" ]; then
            gh release create "$VERSION" \
              --title "Moshi $VERSION" \
              --notes-file "$NOTES" \
              app/build/outputs/apk/release/*.apk
          else
            gh release create "$VERSION" \
              --title "Moshi $VERSION" \
              --generate-notes \
              app/build/outputs/apk/release/*.apk
          fi

      - name: Sweep the signing material
        if: always()
        run: rm -rf keystore/release.jks keystore.properties
